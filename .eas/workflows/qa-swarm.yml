# QA Swarm: one coding agent per lane tests one flow on its own Expo
# Simulators session. From https://docs.expo.dev/agentic-workflows/qa-swarm/
# with two changes for this project: iOS only, and the build profile is
# `agent` (a simulator build), because `preview` makes builds for phones.
# Start it by hand: eas workflow:run .eas/workflows/qa-swarm.yml --ref <branch>
# On another device model: add -F device="iPhone Duo" (see `eas simulator:devices`).
name: QA Swarm

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: The number of a pull request to post the report on
        type: string
        default: ''
      device:
        description: The device model for each lane, such as iPhone Duo. Empty uses the default device.
        type: string
        default: ''

jobs:
  fingerprint:
    type: fingerprint
    environment: preview

  get_build_ios:
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: agent
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    type: build
    needs: [get_build_ios]
    if: ${{ !needs.get_build_ios.outputs.build_id }}
    params:
      platform: ios
      profile: agent

  repack_ios:
    type: repack
    needs: [get_build_ios]
    if: ${{ needs.get_build_ios.outputs.build_id }}
    params:
      build_id: ${{ needs.get_build_ios.outputs.build_id }}
      profile: agent

  lane_ios_launch:
    needs: [get_build_ios]
    after: [build_ios, repack_ios]
    environment: preview
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      PLATFORM: ios
      DEVICE: ${{ inputs.device }}
      FLOW: launch
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
      site_url: ${{ steps.lane.outputs.site_url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-launch-evidence
          path: agent-output/evidence/**/*

  lane_ios_navigation:
    needs: [get_build_ios]
    after: [build_ios, repack_ios]
    environment: preview
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      PLATFORM: ios
      DEVICE: ${{ inputs.device }}
      FLOW: navigation
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
      site_url: ${{ steps.lane.outputs.site_url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-navigation-evidence
          path: agent-output/evidence/**/*

  lane_ios_realm:
    needs: [get_build_ios]
    after: [build_ios, repack_ios]
    environment: preview
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      PLATFORM: ios
      DEVICE: ${{ inputs.device }}
      FLOW: realm
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
      site_url: ${{ steps.lane.outputs.site_url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-realm-evidence
          path: agent-output/evidence/**/*

  lane_ios_sign_in:
    needs: [get_build_ios]
    after: [build_ios, repack_ios]
    environment: preview
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      PLATFORM: ios
      DEVICE: ${{ inputs.device }}
      FLOW: sign-in
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
      site_url: ${{ steps.lane.outputs.site_url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-sign-in-evidence
          path: agent-output/evidence/**/*

  report:
    type: doc
    after: [lane_ios_launch, lane_ios_navigation, lane_ios_realm, lane_ios_sign_in]
    params:
      md: |
        # QA Swarm report

        Device: ${{ inputs.device || 'the default device (iPhone 17)' }}

        The evidence of each lane (verdict, screenshots, agent log and the evidence site) is in the artifacts of its job. It is not on a public site.

        - **iOS, launch:** ${{ after.lane_ios_launch.outputs.verdict || 'FAIL: The lane did not finish.' }}
        - **iOS, navigation:** ${{ after.lane_ios_navigation.outputs.verdict || 'FAIL: The lane did not finish.' }}
        - **iOS, realm:** ${{ after.lane_ios_realm.outputs.verdict || 'FAIL: The lane did not finish.' }}
        - **iOS, sign in:** ${{ after.lane_ios_sign_in.outputs.verdict || 'FAIL: The lane did not finish.' }}
